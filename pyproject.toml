[project]
name = "agnostic-trading-backtest"
version = "0.1.0"
description = "Multi-asset backtest engine with Telegram UI and VPS job queue"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "pyyaml>=6.0",
  "pandas>=2.0",
  "numpy>=1.26",
  "aiogram>=3.4",
  "aiosqlite>=0.19",
  "matplotlib>=3.8",
  "certifi>=2024.0",
  "supabase>=2.28.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[project.scripts]
backtest = "engine.cli:main"
backtest-worker = "worker.runner:main"
backtest-bot = "bot.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["engine*", "bot*", "worker*", "storage*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
