indicators:
  RSI:
    label: RSI
    sweep_template: rsi_oversold_long
    outputs: [value]
    default_output: value
    params:
      period: { type: int, default: 14, min: 2, max: 100 }
    timeframes: [primary, context]

  EMA:
    label: EMA
    sweep_template: ema_trend_long
    outputs: [value]
    default_output: value
    params:
      period: { type: int, default: 20, min: 2, max: 500 }
    timeframes: [primary, context]

  ATR:
    label: ATR
    sweep_template: atr_vol_filter
    outputs: [value]
    default_output: value
    params:
      period: { type: int, default: 14, min: 2, max: 100 }
    timeframes: [primary, context]

  MACD:
    label: MACD
    sweep_template: macd_momentum_long
    outputs: [macd, signal, hist]
    default_output: macd
    params:
      fast: { type: int, default: 12, min: 2, max: 50 }
      slow: { type: int, default: 26, min: 2, max: 100 }
      signal: { type: int, default: 9, min: 2, max: 50 }
    timeframes: [primary, context]

  WAVETREND:
    label: WaveTrend
    sweep_template: wt_cross_long
    outputs: [wt, signal]
    default_output: wt
    params:
      channel_length: { type: int, default: 9, min: 2, max: 50 }
      average_length: { type: int, default: 12, min: 2, max: 50 }
      signal_length: { type: int, default: 4, min: 2, max: 20 }
    timeframes: [primary, context]

  BRESSERT:
    label: Bressert DSS
    sweep_template: bressert_cross_long
    outputs: [dss, signal]
    default_output: dss
    params:
      length: { type: int, default: 8, min: 2, max: 50 }
      smoothing: { type: int, default: 3, min: 1, max: 20 }
      signal_smoothing: { type: int, default: 3, min: 1, max: 20 }
    timeframes: [primary, context]

  STOCHRSI:
    label: Stochastic RSI
    sweep_template: stoch_oversold_long
    outputs: [k, d]
    default_output: k
    params:
      rsi_period: { type: int, default: 14, min: 2, max: 50 }
      stoch_period: { type: int, default: 14, min: 2, max: 50 }
      k_smooth: { type: int, default: 3, min: 1, max: 20 }
      d_smooth: { type: int, default: 3, min: 1, max: 20 }
    timeframes: [primary, context]

  ADX:
    label: ADX / DMI
    sweep_template: adx_trend_long
    outputs: [adx, plus_di, minus_di]
    default_output: adx
    params:
      period: { type: int, default: 14, min: 2, max: 50 }
    timeframes: [primary, context]

  FIB:
    label: Fibonacci retrace
    sweep_template: fib_618_long
    outputs: [level_382, level_618, near_382, near_618]
    default_output: level_618
    params:
      leg_lookback: { type: int, default: 20, min: 5, max: 200 }
      band_pct: { type: float, default: 0.15, min: 0.02, max: 0.5 }
    timeframes: [primary, context]

  LIQUIDITYSWEEP:
    label: Liquidity sweep
    sweep_template: sweep_bull_long
    outputs: [sweep_bull, sweep_bear]
    default_output: sweep_bull
    params:
      pool_lookback: { type: int, default: 20, min: 5, max: 200 }
    timeframes: [primary, context]
