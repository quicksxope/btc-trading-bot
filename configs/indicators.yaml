indicators:
  RSI:
    label: RSI
    outputs: [value]
    default_output: value
    params:
      period: { type: int, default: 14, min: 2, max: 100 }
    timeframes: [primary, context]

  EMA:
    label: EMA
    outputs: [value]
    default_output: value
    params:
      period: { type: int, default: 20, min: 2, max: 500 }
    timeframes: [primary, context]

  ATR:
    label: ATR
    outputs: [value]
    default_output: value
    params:
      period: { type: int, default: 14, min: 2, max: 100 }
    timeframes: [primary, context]

  MACD:
    label: MACD
    outputs: [macd, signal, hist]
    default_output: macd
    params:
      fast: { type: int, default: 12, min: 2, max: 50 }
      slow: { type: int, default: 26, min: 2, max: 100 }
      signal: { type: int, default: 9, min: 2, max: 50 }
    timeframes: [primary, context]

  WAVETREND:
    label: WaveTrend
    outputs: [wt, signal]
    default_output: wt
    params:
      channel_length: { type: int, default: 9, min: 2, max: 50 }
      average_length: { type: int, default: 12, min: 2, max: 50 }
      signal_length: { type: int, default: 4, min: 2, max: 20 }
    timeframes: [primary, context]

  BRESSERT:
    label: Bressert DSS
    outputs: [dss, signal]
    default_output: dss
    params:
      length: { type: int, default: 8, min: 2, max: 50 }
      smoothing: { type: int, default: 3, min: 1, max: 20 }
      signal_smoothing: { type: int, default: 3, min: 1, max: 20 }
    timeframes: [primary, context]
