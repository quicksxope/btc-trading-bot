templates:
  rsi_oversold_long:
    label: "Long if RSI < 30"
    long_when: "primary_RSI_value < 30"
    short_when: "primary_RSI_value > 70"
    requires_indicators:
      - { name: RSI, timeframe: primary, params: { period: 14 } }

  rsi_mid_long:
    label: "Long if RSI > 50"
    long_when: "primary_RSI_value > 50"
    short_when: "primary_RSI_value < 50"
    requires_indicators:
      - { name: RSI, timeframe: primary, params: { period: 14 } }

  wt_cross_long:
    label: "Long on WT cross up"
    long_when: "cross_above(primary_WAVETREND_wt, primary_WAVETREND_signal)"
    short_when: "cross_below(primary_WAVETREND_wt, primary_WAVETREND_signal)"
    requires_indicators:
      - { name: WAVETREND, timeframe: primary, params: {} }

  ema_trend_long:
    label: "Long if close > EMA20"
    long_when: "primary_close > primary_EMA_value"
    short_when: "primary_close < primary_EMA_value"
    requires_indicators:
      - { name: EMA, timeframe: primary, params: { period: 20 } }

  adx_trend_long:
    label: "Trend: ADX>25 & +DI>-DI"
    long_when: "primary_ADX_adx > 25 and primary_ADX_plus_di > primary_ADX_minus_di"
    short_when: "primary_ADX_adx > 25 and primary_ADX_minus_di > primary_ADX_plus_di"
    requires_indicators:
      - { name: ADX, timeframe: primary, params: { period: 14 } }

  stoch_oversold_long:
    label: "Long StochRSI K < 20"
    long_when: "primary_STOCHRSI_k < 20"
    short_when: "primary_STOCHRSI_k > 80"
    requires_indicators:
      - { name: STOCHRSI, timeframe: primary, params: {} }

  fib_618_long:
    label: "Long near Fib 0.618"
    long_when: "primary_FIB_near_618 > 0"
    short_when: "primary_close < primary_FIB_level_618"
    requires_indicators:
      - { name: FIB, timeframe: primary, params: { leg_lookback: 20 } }

  sweep_bull_long:
    label: "Long after bull liquidity sweep"
    long_when: "primary_LIQUIDITYSWEEP_sweep_bull > 0"
    short_when: "primary_LIQUIDITYSWEEP_sweep_bear > 0"
    requires_indicators:
      - { name: LIQUIDITYSWEEP, timeframe: primary, params: { pool_lookback: 20 } }
