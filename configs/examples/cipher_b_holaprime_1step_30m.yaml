instrument: BTC_PERP
asset_class: crypto_perp
date_range:
  start: 2024-01-01
  end: 2024-06-01
session:
  id: all_day
  use_for_trading: true
  use_for_accounting: true
timeframes:
  primary: 30m
  context:
    - 1h
strategy:
  mode: preset
  preset: cipher_b
prop_firm:
  enabled: true
  pack_id: holaprime_1step_10k
